<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f7f3ee;font-family:Arial,Helvetica,sans-serif;color:#2b2622;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f3ee;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
<tr><td style="font-family:Georgia,'Times New Roman',serif;font-size:22px;letter-spacing:0.04em;color:#8a6d3b;padding-bottom:24px;">Glow Derma</td></tr>
<tr><td style="font-size:15px;line-height:22px;padding-bottom:12px;">{{ greeting }}{% if name %} {{ name }}!{% endif %}</td></tr>
<tr><td style="font-size:15px;line-height:22px;padding-bottom:24px;">{{ intro }}</td></tr>
<tr><td align="center" style="padding-bottom:24px;"><a href="{{ link }}" style="display:inline-block;background:#2b2622;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 28px;border-radius:8px;">{{ button }}</a></td></tr>
<tr><td style="font-size:12px;line-height:18px;color:#6b625b;padding-bottom:8px;word-break:break-all;">{{ link }}</td></tr>
<tr><td style="font-size:13px;line-height:20px;color:#6b625b;padding-bottom:24px;">{{ expiry }} {{ ignore }}</td></tr>
<tr><td style="font-size:12px;line-height:18px;color:#9a918a;border-top:1px solid #eee6dc;padding-top:16px;">{{ footer }}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
