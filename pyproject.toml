[project]
name = "glowderma-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
 "Django==6.1.2", "djangorestframework==3.18.3", "drf-spectacular==0.30.0",
 "psycopg[binary,pool]==3.3.6", "gunicorn==26.2.0", "whitenoise==6.12.0",
 "celery[redis]==5.6.3", "redis==6.4.0", "PyJWT==2.15.1", "argon2-cffi==25.1.0",
 "django-filter==26.2", "Pillow==13.0.0", "openpyxl==3.1.5", "httpx==0.28.1", "tenacity==9.2.1",
 "drf-spectacular-sidecar==2026.10.1",
]

[dependency-groups]
dev = [
 "ruff==0.17.2", "mypy==2.3.1", "django-stubs[compatible-mypy]==6.1.2",
 "djangorestframework-stubs[compatible-mypy]==3.18.1", "pytest==9.1.1",
 "pytest-django==4.14.0", "factory-boy==3.3.3", "coverage", "import-linter",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["glowderma"]
branch = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101"]
