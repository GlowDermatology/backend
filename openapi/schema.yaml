  /api/v1/admin/orders/{id}/cancel/:
    post:
      operationId: admin_orders_cancel
      description: 'Cancel an order (full refund when paid). A Yandex Delivery order
        is first made carrier-safe outside the transaction (plan §3.8): an open courier
        claim is cancelled at Yandex before pickup (free or paid), after pickup a
        return to the warehouse is requested and the cancel proceeds once Yandex reports
        it `returning`; a returning / returned parcel needs no call, a delivered order
        is refused. 409 `not_cancellable` (Yandex refused, delivered, parcel not coming
        back), 409 `return_requested` (return asked, not confirmed yet: retry later;
        the order is unchanged), 409 `conflict` (another Yandex operation of the order
        is running, or Yandex has not shown the cancel yet), 503 `provider_unavailable`
        (Yandex did not answer; nothing changed).'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: 'Client-generated UUID; replays return the stored response with
          `Idempotent-Replayed: true`.'
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        required: true
      security:
      - StaffJWT: []
      responses:
