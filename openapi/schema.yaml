  /api/v1/admin/orders/:
    get:
      operationId: admin_orders_list
      description: |-
        ``?export=csv|xlsx`` of an admin list (contract 1.8).

        ``export_name`` (the file name stem and the sheet title) and ``export_headers`` are Uzbek source texts:
        they are rendered with ``core.uzsource.tr`` in the request's ``Accept-Language``
        (``core.api.language.admin_language``), and ``get_export_rows`` runs with that language active, so the
        values it takes from ``core.labels.text`` (and ``yes_no``, ``active_label``, ``refund_state_label``)
        follow it. Data (names, ids, amounts, dates) is never translated; the ``export.downloaded`` audit row is
        written in Uzbek outside that scope.
      parameters:
      - in: query
        name: attention
        schema:
          enum:
          - open
          - urgent
          type: string
          minLength: 1
        description: |-
          `open`: the order has an open delivery issue; `urgent`: an open urgent one.

          * `open` - open
          * `urgent` - urgent
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
          - xlsx
        description: Download the filtered list as a file instead of the JSON page.
      - in: query
        name: fulfilment
        schema:
          enum:
          - delivery
          - pickup
          type: string
          minLength: 1
        description: |-
          * `delivery` - delivery
          * `pickup` - pickup
      - in: query
        name: ordering
        schema:
          enum:
          - -created_at
          - created_at
          type: string
          default: -created_at
          minLength: 1
        description: |-
          * `-created_at` - -created_at
          * `created_at` - created_at
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 6
          - 10
          - 25
          - 50
      - in: query
        name: payment
        schema:
          enum:
          - pending
          - paid
          - failed
          - refunded
          type: string
          minLength: 1
        description: |-
          * `pending` - pending
          * `paid` - paid
          * `failed` - failed
          * `refunded` - refunded
      - in: query
        name: period
        schema:
          enum:
          - today
          - week
          - month
          - all
          type: string
          default: all
          minLength: 1
        description: |-
          * `today` - today
          * `week` - week
          * `month` - month
          * `all` - all
      - in: query
        name: provider
        schema:
          enum:
          - bts
          - yandex
          type: string
          minLength: 1
        description: |-
          The shipment's carrier.

          * `bts` - bts
          * `yandex` - yandex
      - in: query
        name: search
        schema:
          type: string
          maxLength: 64
      - in: query
        name: stage
        schema:
          enum:
          - awaiting_dispatch
          - courier_requested
          - courier_assigned
          - courier_arrived
          - in_transit
          - at_destination
          - delivered
          - returning
          - returned
          - cancelled
          - failed
          type: string
          minLength: 1
        description: |-
          A Yandex shipment's stage.

          * `awaiting_dispatch` - awaiting_dispatch
          * `courier_requested` - courier_requested
          * `courier_assigned` - courier_assigned
          * `courier_arrived` - courier_arrived
          * `in_transit` - in_transit
          * `at_destination` - at_destination
          * `delivered` - delivered
          * `returning` - returning
          * `returned` - returned
          * `cancelled` - cancelled
          * `failed` - failed
      - in: query
        name: status
        schema:
          enum:
          - awaiting_payment
          - processing
          - handed_to_courier
          - delivered
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `awaiting_payment` - awaiting_payment
          * `processing` - processing
          * `handed_to_courier` - handed_to_courier
          * `delivered` - delivered
          * `cancelled` - cancelled
      tags:
      - admin
