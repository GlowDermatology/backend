    get:
      operationId: admin_notifications_list
      description: |-
        ``?export=csv|xlsx`` of an admin list (contract 1.8).

        ``export_name`` (the file name stem and the sheet title) and ``export_headers`` are Uzbek source texts:
        they are rendered with ``core.uzsource.tr`` in the request's ``Accept-Language``
        (``core.api.language.admin_language``), and ``get_export_rows`` runs with that language active, so the
        values it takes from ``core.labels.text`` (and ``yes_no``, ``active_label``, ``refund_state_label``)
        follow it. Data (names, ids, amounts, dates) is never translated; the ``export.downloaded`` audit row is
        written in Uzbek outside that scope.
      parameters:
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
          - xlsx
        description: Download the filtered list as a file instead of the JSON page.
      - in: query
        name: kind
        schema:
          enum:
          - promo
          - general
          type: string
          minLength: 1
        description: |-
          * `promo` - promo
          * `general` - general
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 20
          - 50
      - in: query
        name: state
        schema:
          enum:
          - draft
          - tested
          - scheduled
          - sending
          - stopping
          - sent
          - partially_sent
          - cancelled
          - failed
          type: string
          minLength: 1
        description: |-
          * `draft` - draft
          * `tested` - tested
          * `scheduled` - scheduled
          * `sending` - sending
          * `stopping` - stopping
          * `sent` - sent
          * `partially_sent` - partially_sent
          * `cancelled` - cancelled
          * `failed` - failed
      tags:
      - admin
      security:
      - StaffJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationRecordList'
