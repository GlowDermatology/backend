        name.uz:
          type: string
          minLength: 2
          maxLength: 60
        name.ru:
          type: string
          maxLength: 60
        name.en:
          type: string
          maxLength: 60
        is_active:
          type: boolean
        image:
          type: string
          format: binary
        remove_image:
          type: boolean
        seo.uz.title:
          type: string
          maxLength: 120
        seo.uz.description:
          type: string
          maxLength: 300
        seo.ru.title:
          type: string
          maxLength: 120
        seo.ru.description:
          type: string
          maxLength: 300
        seo.en.title:
          type: string
          maxLength: 120
        seo.en.description:
          type: string
          maxLength: 300
