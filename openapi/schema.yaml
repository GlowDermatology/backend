  /api/v1/admin/orders/{id}/confirm-return/:
    post:
      operationId: admin_orders_confirm_return
      description: 'Confirm that the parcel of a Yandex order whose delivery stage
        is `returning` / `returned` is physically back at the warehouse: stage `returned`,
        `returned_at`, the open `return_pending` issue resolved (the note is its resolution
