          type: string
          nullable: true
          minLength: 1
          pattern: ^\+998\d{9}$
        cosmetologist_phone:
          type: string
          nullable: true
          minLength: 1
          pattern: ^\+998\d{9}$
        telegram_url:
          type: string
          nullable: true
          maxLength: 200
        instagram_url:
          type: string
          nullable: true
          maxLength: 200
        website_url:
          type: string
          nullable: true
          maxLength: 200
        pickup_address:
          $ref: '#/components/schemas/PickupAddressRequest'
        terms:
          $ref: '#/components/schemas/LegalTextPatchRequest'
        privacy_policy:
          $ref: '#/components/schemas/LegalTextPatchRequest'
        booking_policy:
          $ref: '#/components/schemas/BookingPolicyPatchRequest'
