      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        ingredients:
          type: string
          maxLength: 1000
        usage:
          type: string
          maxLength: 1000
    ProductTextRequest:
      type: object
      description: 'One language of ``texts``: ``{name, description, ingredients,
        usage}``.'
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        ingredients:
          type: string
          maxLength: 1000
        usage:
          type: string
          maxLength: 1000
    ProductTexts:
      type: object
      description: 'Language-first product texts ``{uz: {...}, ru: {...}, en: {...}}``
        (AGENTS.md: not ``i18n_text``).'
      properties:
        uz:
          $ref: '#/components/schemas/ProductUzText'
        ru:
          $ref: '#/components/schemas/ProductText'
        en:
          $ref: '#/components/schemas/ProductText'
      required:
      - uz
    ProductTextsPatchRequest:
      type: object
      description: '``texts`` of ``PATCH products/{id}/``: any subset of languages
        and leaves (§2.3 leaf merge).'
      properties:
        uz:
          $ref: '#/components/schemas/ProductUzTextPatchRequest'
        ru:
          $ref: '#/components/schemas/ProductTextRequest'
        en:
          $ref: '#/components/schemas/ProductTextRequest'
    ProductTextsRequest:
      type: object
      description: 'Language-first product texts ``{uz: {...}, ru: {...}, en: {...}}``
        (AGENTS.md: not ``i18n_text``).'
      properties:
        uz:
          $ref: '#/components/schemas/ProductUzTextRequest'
        ru:
          $ref: '#/components/schemas/ProductTextRequest'
        en:
          $ref: '#/components/schemas/ProductTextRequest'
      required:
      - uz
    ProductUzText:
      type: object
      description: 'The Uzbek texts: ``name`` is mandatory on create and, whenever
        sent, trimmed 2..120 characters.'
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        ingredients:
          type: string
          maxLength: 1000
        usage:
          type: string
          maxLength: 1000
      required:
      - name
    ProductUzTextPatchRequest:
      type: object
      description: 'PATCH leaf merge: every Uzbek leaf is optional; a sent ``name``
        keeps the 2..120 rule.'
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        ingredients:
          type: string
          maxLength: 1000
        usage:
          type: string
          maxLength: 1000
    ProductUzTextRequest:
      type: object
      description: 'The Uzbek texts: ``name`` is mandatory on create and, whenever
        sent, trimmed 2..120 characters.'
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        ingredients:
          type: string
          maxLength: 1000
        usage:
          type: string
          maxLength: 1000
      required:
      - name
    ProductWriteRequest:
      type: object
      description: |-
        Body of ``POST products/`` (every rule of the §2.3 table) and ``PATCH products/{id}/`` (``partial``).

        ``context["billz"]`` may carry a ``BillzPort`` (tests); otherwise the configured adapter is used.
      properties:
        billz_id:
          type: string
          minLength: 1
          pattern: ^\d{6,14}$
        texts:
          $ref: '#/components/schemas/ProductTextsRequest'
        price:
          type: integer
          maximum: 100000000
          minimum: 1000
        category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
        promo:
          type: boolean
          default: false
        status:
          allOf:
          - $ref: '#/components/schemas/ProductStatusEnum'
          default: hidden
      required:
      - billz_id
      - price
      - texts
