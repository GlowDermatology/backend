    PatchedProductPatchRequest:
      type: object
      description: |-
        ``PATCH products/{id}/``: every field optional and ``texts`` merged leaf by leaf (contract §2.3).

        Validation is the create serializer's (``partial=True`` skips absent fields); the separate class gives the
        OpenAPI request its true shape, where no ``texts`` leaf is required.
      properties:
        billz_id:
          type: string
          minLength: 1
          pattern: ^\d{6,14}$
        texts:
          $ref: '#/components/schemas/ProductTextsPatchRequest'
        price:
          type: integer
          maximum: 100000000
          minimum: 1000
        category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
        promo:
          type: boolean
          default: false
        status:
          allOf:
          - $ref: '#/components/schemas/ProductStatusEnum'
          default: hidden
        slug:
          type: string
          minLength: 1
          description: Optional on create (derived from the Uzbek name).
          maxLength: 140
        seo:
          $ref: '#/components/schemas/SeoTextsRequest'
