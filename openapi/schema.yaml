components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
      required:
      - access
      - access_expires_at
      - refresh_expires_at
    Ack:
      type: object
      properties:
        acknowledged:
          type: integer
      required:
      - acknowledged
    AckRequestRequest:
      type: object
      properties:
        inbox_ids:
          type: array
          items:
            type: integer
            maximum: 9223372036854775807
            minimum: -9223372036854775808
            format: int64
          maxItems: 50
      required:
      - inbox_ids
    Actor:
      type: object
      description: |-
        ``Actor = {"id", "display_name"}``: the staff full name, else the email (``null`` = system).

        Takes any staff user instance; declare it with ``allow_null=True`` where the actor may be the system.
      properties:
        id:
          type: integer
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
    AddressWriteRequest:
      type: object
      description: |-
        ``POST`` (``text`` required) and ``PATCH`` (``partial``) of ``me/addresses/`` (customer contract
        §2.2.7).
      properties:
        label:
          type: string
          maxLength: 60
        text:
          type: string
          minLength: 1
          maxLength: 300
        region_code:
          type: string
        city_code:
          type: string
        comment:
          type: string
          maxLength: 200
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
        is_default:
          type: boolean
      required:
      - text
    AdjustmentDirectionEnum:
      enum:
      - add
      - subtract
      type: string
      description: |-
        * `add` - add
        * `subtract` - subtract
    AdminCustomerSession:
      type: object
      description: One open session of the customer (``CustomerSession`` without ``current``).
      properties:
        id:
          type: string
          format: uuid
        device:
          type: string
        platform:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OrderChannelEnum'
          - $ref: '#/components/schemas/NullEnum'
        location:
          type: string
          description: '"Tashkent, Tashkent, UZ"; "—" when unknown.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - device
      - id
      - location
      - platform
      - updated_at
    AppointmentCancelRequest:
      type: object
      description: '``POST appointments/{id}/cancel/``: optional ``reason`` (≤ 300),
        kept as the staff note.'
      properties:
        reason:
          type: string
          maxLength: 300
    AppointmentCancelledByEnum:
      enum:
      - customer
      - admin
      type: string
      description: |-
        * `customer` - customer
        * `admin` - admin
    AppointmentCreateRequest:
      type: object
      description: |-
        ``POST appointments/`` (T10): ``specialist_id``, ``service_id``, ``customer_id`` | ``phone`` (E.164 of
        an active customer), ``start`` (aware, 5-minute grid, inside working hours), ``note`` (≤ 300).
      properties:
        specialist_id:
          type: integer
        service_id:
          type: integer
        customer_id:
          type: integer
        phone:
          type: string
          minLength: 1
          pattern: ^\+998\d{9}$
        start:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 300
      required:
      - service_id
      - specialist_id
      - start
    AppointmentItem:
      type: object
      description: The day-item shape (contract §2.9), also returned by every action
        endpoint.
      properties:
        id:
          type: integer
        specialist_id:
          type: integer
        customer:
          $ref: '#/components/schemas/CustomerRef'
        service_id:
          type: integer
        service_name:
          type: string
        service_short_name:
          type: string
        duration_min:
          type: integer
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        price:
          type: integer
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        requested_at:
          type: string
          format: date-time
        requested_via:
          $ref: '#/components/schemas/RequestedViaEnum'
      required:
      - customer
      - duration_min
      - end
      - id
      - price
      - requested_at
      - requested_via
      - service_id
      - service_name
      - service_short_name
      - specialist_id
      - start
      - status
    AppointmentLocation:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        phone:
          type: string
          nullable: true
          readOnly: true
      required:
      - address
      - name
      - phone
    AppointmentRescheduleRequest:
      type: object
      description: '``POST appointments/{id}/reschedule/``: ``start`` (same slot rules),
        optional ``specialist_id``.'
      properties:
        start:
          type: string
          format: date-time
        specialist_id:
          type: integer
      required:
      - start
    AppointmentService:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          readOnly: true
        short_name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - short_name
    AppointmentSpecialist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          $ref: '#/components/schemas/SpecialistRoleEnum'
        role_label:
          type: string
          readOnly: true
        photo_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - id
      - name
      - photo_url
      - role
      - role_label
    AppointmentStatusEnum:
      enum:
      - requested
      - confirmed
      - rejected
      - attended
      - cancelled
      type: string
      description: |-
        * `requested` - requested
        * `confirmed` - confirmed
        * `rejected` - rejected
        * `attended` - attended
        * `cancelled` - cancelled
    AppointmentsMeta:
      type: object
      properties:
        specialists:
          type: array
          items:
            $ref: '#/components/schemas/BookingSpecialist'
        slot_step_min:
          type: integer
      required:
      - slot_step_min
      - specialists
    AudienceTypeEnum:
      enum:
      - all
      - segment
      - customer
      type: string
      description: |-
        * `all` - all
        * `segment` - segment
        * `customer` - customer
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          allOf:
          - $ref: '#/components/schemas/Actor'
          nullable: true
          readOnly: true
        action:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        data:
          nullable: true
          readOnly: true
        ip:
          type: string
          nullable: true
        request_id:
          type: string
      required:
      - action
      - actor
      - at
      - data
      - id
      - ip
      - object_id
      - object_type
      - request_id
    AuthMethodEnum:
      enum:
      - password
      - google
      - facebook
      - apple
      type: string
      description: |-
        * `password` - password
        * `google` - google
        * `facebook` - facebook
        * `apple` - apple
    AuthTokens:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        device_key:
          type: string
          nullable: true
        customer:
          $ref: '#/components/schemas/CustomerMe'
        is_new_customer:
          type: boolean
        reactivated:
          type: boolean
      required:
      - access
      - access_expires_at
      - customer
      - device_key
      - is_new_customer
      - reactivated
      - refresh
      - refresh_expires_at
    AuthTokensOrNextStep:
