components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
      required:
      - access
      - access_expires_at
      - refresh_expires_at
    Ack:
      type: object
      properties:
        acknowledged:
          type: integer
      required:
