                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/admin/appointments/{id}/{action}/:
    post:
      operationId: admin_appointments_action
      description: confirm / reject (from requested) or attend (from confirmed); otherwise
        409 invalid_transition.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: 'Client-generated UUID; replays return the stored response with
          `Idempotent-Replayed: true`.'
        required: true
      - in: path
        name: action
        schema:
          type: string
          enum:
          - attend
          - confirm
          - reject
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - StaffJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentItem'
          description: ''
        '400':
