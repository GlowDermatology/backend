        is_active:
          type: boolean
        product_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - is_active
      - name
      - position
      - product_count
      - slug
      - updated_at
    CategoryNameRequest:
      type: object
      description: |-
        Contract §2.4 ``name``: ``uz`` 2..60 required; ``ru`` / ``en`` ≤ 60 optional (missing on create → "").

        The core ``i18n_text`` shape requires every language; the catalog write shapes only require Uzbek.
      properties:
        uz:
          type: string
          minLength: 2
          maxLength: 60
        ru:
          type: string
          default: ''
          maxLength: 60
        en:
          type: string
          default: ''
          maxLength: 60
      required:
      - uz
    CategoryResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - results
