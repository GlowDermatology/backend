          minLength: 2
          maxLength: 60
        name.ru:
          type: string
          maxLength: 60
        name.en:
          type: string
          maxLength: 60
        is_active:
          type: boolean
        image:
          type: string
          format: binary
        remove_image:
          type: boolean
        seo.uz.title:
          type: string
          maxLength: 120
        seo.uz.description:
          type: string
          maxLength: 300
        seo.ru.title:
          type: string
          maxLength: 120
        seo.ru.description:
          type: string
          maxLength: 300
        seo.en.title:
          type: string
          maxLength: 120
        seo.en.description:
          type: string
          maxLength: 300
    PatchedCategoryPatchRequest:
      type: object
      description: |-
        ``PATCH categories/{slug}/``: every field optional; ``remove_image: true`` drops the stored image
        (gap ADM-5.1; refused together with a new ``image`` part: ``remove_image`` ``invalid``).
      properties:
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]{2,40}$
        name:
          $ref: '#/components/schemas/CategoryNameRequest'
        is_active:
          type: boolean
          default: true
        seo:
          $ref: '#/components/schemas/SeoTextsRequest'
        remove_image:
          type: boolean
          default: false
    PatchedClinicLocationPatchRequest:
      type: object
      description: |-
        Body of ``PATCH location/`` (validated with ``partial=True``; texts merge leaf by leaf). The first
        PATCH creates the clinic and then needs ``name.uz``; ``latitude`` and ``longitude`` are a pair.
      properties:
        name:
          $ref: '#/components/schemas/LocationNameRequest'
        address:
          $ref: '#/components/schemas/LocationAddressRequest'
        phone:
          type: string
          nullable: true
          minLength: 1
          pattern: ^\+998\d{9}$
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
    PatchedClinicServiceWriteRequest:
      type: object
      description: Body of ``POST services/`` and (``partial``) ``PATCH services/{id}/``
        (texts merge leaf by leaf).
      properties:
        name:
          $ref: '#/components/schemas/ServiceNameRequest'
        short_name:
          $ref: '#/components/schemas/ServiceShortNameRequest'
        description:
          $ref: '#/components/schemas/ServiceDescriptionRequest'
        category:
          $ref: '#/components/schemas/ServiceCategoryEnum'
        default_duration_min:
          type: integer
          maximum: 480
          minimum: 5
          description: Minutes, a multiple of 5 (5 … 480).
        default_price:
          type: integer
          maximum: 100000000
          minimum: 0
          nullable: true
          description: Suggested price when offering it; null = none.
        position:
          type: integer
          maximum: 100000
          minimum: 0
        is_active:
          type: boolean
          default: true
    PatchedClinicSpecialistPatchRequest:
      type: object
      description: |-
        ``PATCH specialists/{id}/`` (validated with ``partial=True``): every field optional; ``qualifications``
        and ``bio`` merge leaf by leaf; ``force`` confirms a deactivation despite upcoming appointments.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        role:
          $ref: '#/components/schemas/SpecialistRoleEnum'
        qualifications:
          $ref: '#/components/schemas/SpecialistTextRequest'
        bio:
          $ref: '#/components/schemas/SpecialistTextRequest'
        experience_years:
          type: integer
          maximum: 80
          minimum: 0
          nullable: true
        slot_step_min:
          type: integer
          description: 'The customer slot grid in minutes: 10, 15, 20, 30 (default)
            or 60.'
        location_id:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: 'Default: the clinic (GET location/).'
        staff_user_id:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          description: An active staff account, or null.
        position:
          type: integer
          maximum: 100000
          minimum: 0
        is_active:
          type: boolean
          default: false
        slug:
          type: string
          minLength: 1
          description: Optional on create (derived from the name).
          maxLength: 160
        force:
          type: boolean
          default: false
          description: 'With is_active=false: deactivate even with requested/confirmed
            appointments ahead.'
