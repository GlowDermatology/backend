          $ref: '#/components/schemas/IntegrationModeEnum'
        billz:
          $ref: '#/components/schemas/IntegrationModeEnum'
        fcm:
          $ref: '#/components/schemas/IntegrationModeEnum'
        click:
          $ref: '#/components/schemas/IntegrationModeEnum'
        payme:
          $ref: '#/components/schemas/IntegrationModeEnum'
        bts:
          $ref: '#/components/schemas/IntegrationModeEnum'
      required:
      - billz
      - bts
      - click
      - fcm
      - oauth
      - payme
