          $ref: '#/components/schemas/BannerLinkKindEnum'
        link.product_id:
          type: integer
          nullable: true
        link.category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
        is_active:
          type: boolean
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
    PatchedBannerPatchRequest:
      type: object
      description: |-
        ``PATCH banners/{id}/`` (JSON or multipart): ``title`` merged leaf by leaf, every field optional.

        An unchanged ``link.product_id`` is not re-checked against the active products, so a banner whose product
        was hidden later can still be edited or switched off (contract §2.5).
      properties:
        title:
          $ref: '#/components/schemas/BannerTitlePatchRequest'
        link:
          $ref: '#/components/schemas/BannerLinkRequest'
        is_active:
          type: boolean
          default: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
    PatchedCategoryWriteRequest:
      type: object
      description: '``POST categories/`` and ``PATCH categories/{slug}/`` (``partial``;
        ``slug`` is then ``read_only``).'
      properties:
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]{2,40}$
        name:
          $ref: '#/components/schemas/CategoryNameRequest'
        is_active:
          type: boolean
          default: true
    PatchedCustomerCartQuantityRequest:
      type: object
      properties:
        quantity:
          type: integer
          maximum: 99
          minimum: 1
    PatchedMePatchRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        language:
          $ref: '#/components/schemas/ContentLanguageEnum'
        push_enabled:
          type: boolean
    PatchedProductPatchRequest:
      type: object
      description: |-
        ``PATCH products/{id}/``: every field optional and ``texts`` merged leaf by leaf (contract §2.3).

        Validation is the create serializer's (``partial=True`` skips absent fields); the separate class gives the
        OpenAPI request its true shape, where no ``texts`` leaf is required.
      properties:
        billz_id:
          type: string
          minLength: 1
          pattern: ^\d{6,14}$
        texts:
          $ref: '#/components/schemas/ProductTextsPatchRequest'
        price:
          type: integer
          maximum: 100000000
          minimum: 1000
        category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
        promo:
          type: boolean
          default: false
        status:
          allOf:
          - $ref: '#/components/schemas/ProductStatusEnum'
          default: hidden
    PatchedSegmentWriteRequest:
      type: object
      description: '``POST segments/`` (``name`` 2..60 unique, ``rules``) and ``PATCH
        segments/{id}/`` (partial).'
      properties:
        name:
