components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
      required:
      - access
      - access_expires_at
      - refresh_expires_at
    Actor:
      type: object
      description: 'Contract §2.0 ``Actor = {"id", "display_name"}``: the staff full
        name, else the email.'
      properties:
        id:
          type: integer
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
    Banner:
      type: object
      description: Contract §2.5 ``Banner``; instances come from ``selectors.banner_queryset()``.
      properties:
        id:
          type: integer
        title:
          allOf:
          - $ref: '#/components/schemas/I18nText80'
          readOnly: true
        image_url:
          type: string
          format: uri
          readOnly: true
        link:
          allOf:
          - $ref: '#/components/schemas/BannerLink'
          readOnly: true
        is_active:
          type: boolean
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - ends_at
      - id
      - image_url
      - is_active
      - link
      - position
      - starts_at
      - title
      - updated_at
    BannerFormRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
        title.uz:
          type: string
          minLength: 1
          maxLength: 80
        title.ru:
          type: string
          maxLength: 80
        title.en:
          type: string
          maxLength: 80
        link.kind:
          $ref: '#/components/schemas/BannerLinkKindEnum'
        link.product_id:
          type: integer
          nullable: true
        link.category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
        is_active:
          type: boolean
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
      required:
      - title.uz
    BannerLink:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BannerLinkKindEnum'
        product_id:
          type: integer
          nullable: true
        category:
          type: string
          nullable: true
          maxLength: 40
    BannerLinkKindEnum:
      enum:
      - none
      - product
      - category
      type: string
      description: |-
        * `none` - none
        * `product` - product
        * `category` - category
    BannerLinkRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BannerLinkKindEnum'
        product_id:
          type: integer
          nullable: true
        category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
    BannerResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Banner'
      required:
      - results
    BannerTitleRequest:
      type: object
      description: 'Contract §2.5 ``title``: ``uz`` 1..80 required; ``ru`` / ``en``
        ≤ 80 optional (missing → "").'
      properties:
        uz:
          type: string
          minLength: 1
          maxLength: 80
        ru:
          type: string
          default: ''
          maxLength: 80
        en:
          type: string
          default: ''
          maxLength: 80
      required:
      - uz
    BillzImportModeEnum:
      enum:
      - delta
      - full
      type: string
      description: |-
        * `delta` - delta
        * `full` - full
    BillzImportRequest:
      type: object
      description: 'Body of ``POST integrations/billz/import/``: ``{}`` or ``{"mode":
        "delta"|"full"}``.'
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/BillzImportModeEnum'
          default: delta
    BillzStatus:
      type: object
      properties:
        connected:
          type: boolean
        last_sync_at:
          type: string
          format: date-time
          nullable: true
      required:
      - connected
      - last_sync_at
    Category:
      type: object
      description: Contract §2.4 ``Category``; instances come from ``selectors.category_queryset()``.
      properties:
        slug:
          type: string
        name:
          allOf:
          - $ref: '#/components/schemas/I18nText60'
          readOnly: true
        position:
          type: integer
        is_active:
          type: boolean
        product_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - is_active
      - name
      - position
      - product_count
      - slug
      - updated_at
    CategoryNameRequest:
      type: object
      description: |-
        Contract §2.4 ``name``: ``uz`` 2..60 required; ``ru`` / ``en`` ≤ 60 optional (missing on create → "").

        The core ``i18n_text`` shape requires every language; the catalog write shapes only require Uzbek.
      properties:
        uz:
          type: string
          minLength: 2
          maxLength: 60
        ru:
          type: string
          default: ''
          maxLength: 60
        en:
          type: string
          default: ''
          maxLength: 60
      required:
      - uz
    CategoryResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - results
    CategoryWriteRequest:
      type: object
      description: '``POST categories/`` and ``PATCH categories/{slug}/`` (``partial``;
        ``slug`` is then ``read_only``).'
      properties:
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]{2,40}$
        name:
          $ref: '#/components/schemas/CategoryNameRequest'
        is_active:
          type: boolean
          default: true
      required:
      - name
      - slug
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        request_id:
          type: string
      required:
      - code
      - errors
      - message
      - request_id
    ErrorItem:
      type: object
      properties:
        field:
          type: string
          nullable: true
        code:
