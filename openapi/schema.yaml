  /api/v1/admin/audit-log/:
    get:
      operationId: admin_audit_log_list
      description: |-
        ``?export=csv|xlsx`` of an admin list (contract 1.8).

        ``export_name`` (the file name stem and the sheet title) and ``export_headers`` are Uzbek source texts:
        they are rendered with ``core.uzsource.tr`` in the request's ``Accept-Language``
        (``core.api.language.admin_language``), and ``get_export_rows`` runs with that language active, so the
        values it takes from ``core.labels.text`` (and ``yes_no``, ``active_label``, ``refund_state_label``)
        follow it. Data (names, ids, amounts, dates) is never translated; the ``export.downloaded`` audit row is
        written in Uzbek outside that scope.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: actor
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
          - xlsx
        description: Download the filtered list as a file instead of the JSON page.
      - in: query
        name: object_id
        schema:
          type: string
          minLength: 1
          maxLength: 254
      - in: query
        name: object_type
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: ordering
        schema:
          enum:
          - -at
          - at
          type: string
          default: -at
          minLength: 1
        description: |-
          * `-at` - -at
          * `at` - at
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 20
          - 50
      - in: query
        name: request_id
        schema:
          type: string
          minLength: 1
        description: 'The start of a request id (8–64 characters `A-Z a-z 0-9 -`):
          entries whose stored request id begins with it.'
      tags:
      - admin
      security:
      - StaffJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
