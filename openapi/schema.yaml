    get:
      operationId: admin_specialists_list
      description: |-
        ``?export=csv|xlsx`` of an admin list (contract 1.8).

        ``export_name`` (the file name stem and the sheet title) and ``export_headers`` are Uzbek source texts:
        they are rendered with ``core.uzsource.tr`` in the request's ``Accept-Language``
        (``core.api.language.admin_language``), and ``get_export_rows`` runs with that language active, so the
        values it takes from ``core.labels.text`` (and ``yes_no``, ``active_label``, ``refund_state_label``)
        follow it. Data (names, ids, amounts, dates) is never translated; the ``export.downloaded`` audit row is
        written in Uzbek outside that scope.
      parameters:
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
          - xlsx
        description: Download the filtered list as a file instead of the JSON page.
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          enum:
          - position
          - name
          - -name
          - created_at
          - -created_at
          type: string
          default: position
          minLength: 1
        description: |-
          * `position` - position
          * `name` - name
          * `-name` - -name
          * `created_at` - created_at
          * `-created_at` - -created_at
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 20
          - 50
      - in: query
        name: role
        schema:
          enum:
          - dermatologist
          - cosmetologist
          type: string
          minLength: 1
        description: |-
          * `dermatologist` - dermatologist
          * `cosmetologist` - cosmetologist
      - in: query
        name: search
        schema:
          type: string
      tags:
      - admin
      security:
      - StaffJWT: []
