      description: 'Book a slot (`requested`; staff confirm it). Checks in order:
        specialist, service, consent, open appointments limit, then the start (aware,
        lead time, horizon, grid, hours, busy, own overlap); a lost race answers 409
        `slot_taken`.'
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: First supported tag among uz, ru, en in q-order; else the customer's
          language, else uz.
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: 'Client-generated UUID; replays return the stored response with
          `Idempotent-Replayed: true`.'
        required: true
      - in: header
        name: X-GD-App-Version
        schema:
          type: string
          pattern: ^\d{1,3}\.\d{1,3}\.\d{1,3}$
        description: App version; below the platform's minimum → 426 `app_update_required`.
        required: true
      - in: header
        name: X-GD-Device-Id
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,128}$
        description: Firebase installation id of this app install (an identifier,
          not a secret).
        required: true
      - in: header
        name: X-GD-Platform
        schema:
          type: string
          enum:
          - android
          - ios
        description: Device platform (`OrderChannel` literals).
