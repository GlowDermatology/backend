components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
      required:
      - access
      - access_expires_at
      - refresh_expires_at
    Actor:
      type: object
      description: |-
        ``Actor = {"id", "display_name"}``: the staff full name, else the email (``null`` = system).

        Takes any staff user instance; declare it with ``allow_null=True`` where the actor may be the system.
      properties:
        id:
          type: integer
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
    AdjustmentDirectionEnum:
      enum:
      - add
      - subtract
      type: string
      description: |-
        * `add` - add
        * `subtract` - subtract
    AppointmentCancelRequest:
      type: object
      description: '``POST appointments/{id}/cancel/``: optional ``reason`` (≤ 300),
        kept as the staff note.'
      properties:
        reason:
          type: string
          maxLength: 300
    AppointmentCreateRequest:
      type: object
      description: |-
        ``POST appointments/`` (T10): ``specialist_id``, ``service_id``, ``customer_id`` | ``phone`` (E.164 of
        an active customer), ``start`` (aware, 5-minute grid, inside working hours), ``note`` (≤ 300).
      properties:
        specialist_id:
          type: integer
        service_id:
          type: integer
        customer_id:
          type: integer
        phone:
          type: string
          minLength: 1
          pattern: ^\+998\d{9}$
        start:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 300
      required:
      - service_id
      - specialist_id
      - start
    AppointmentItem:
      type: object
      description: The day-item shape (contract §2.9), also returned by every action
        endpoint.
      properties:
        id:
          type: integer
        specialist_id:
          type: integer
        customer:
          $ref: '#/components/schemas/CustomerRef'
        service_id:
          type: integer
        service_name:
          type: string
        service_short_name:
          type: string
        duration_min:
          type: integer
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        price:
          type: integer
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        requested_at:
          type: string
          format: date-time
        requested_via:
          $ref: '#/components/schemas/RequestedViaEnum'
      required:
      - customer
      - duration_min
      - end
      - id
      - price
      - requested_at
      - requested_via
      - service_id
      - service_name
      - service_short_name
      - specialist_id
      - start
      - status
    AppointmentRescheduleRequest:
      type: object
      description: '``POST appointments/{id}/reschedule/``: ``start`` (same slot rules),
        optional ``specialist_id``.'
      properties:
        start:
          type: string
          format: date-time
        specialist_id:
          type: integer
      required:
      - start
    AppointmentStatusEnum:
      enum:
      - requested
      - confirmed
      - rejected
      - attended
      - cancelled
      type: string
      description: |-
        * `requested` - requested
        * `confirmed` - confirmed
        * `rejected` - rejected
        * `attended` - attended
        * `cancelled` - cancelled
    AppointmentsMeta:
      type: object
      properties:
        specialists:
          type: array
          items:
            $ref: '#/components/schemas/BookingSpecialist'
        slot_step_min:
          type: integer
      required:
      - slot_step_min
      - specialists
    AudienceTypeEnum:
      enum:
      - all
      - segment
      - customer
      type: string
      description: |-
        * `all` - all
        * `segment` - segment
        * `customer` - customer
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          allOf:
          - $ref: '#/components/schemas/Actor'
          nullable: true
          readOnly: true
        action:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        data:
          nullable: true
          readOnly: true
        ip:
          type: string
          nullable: true
        request_id:
          type: string
      required:
      - action
      - actor
      - at
      - data
      - id
      - ip
      - object_id
      - object_type
      - request_id
    AvailableActions:
      type: object
      properties:
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusEnum'
        cancel:
          type: boolean
        retry_shipment:
          type: boolean
      required:
      - cancel
      - retry_shipment
      - transitions
    Banner:
      type: object
      description: Contract §2.5 ``Banner``; instances come from ``selectors.banner_queryset()``.
      properties:
        id:
          type: integer
        title:
          allOf:
          - $ref: '#/components/schemas/I18nText80'
          readOnly: true
        image_url:
          type: string
          format: uri
          readOnly: true
        link:
          allOf:
          - $ref: '#/components/schemas/BannerLink'
          readOnly: true
        is_active:
          type: boolean
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - ends_at
      - id
      - image_url
      - is_active
      - link
      - position
      - starts_at
      - title
      - updated_at
    BannerFormRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
        title.uz:
          type: string
          minLength: 1
          maxLength: 80
        title.ru:
          type: string
          maxLength: 80
        title.en:
          type: string
          maxLength: 80
        link.kind:
          $ref: '#/components/schemas/BannerLinkKindEnum'
        link.product_id:
          type: integer
          nullable: true
        link.category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
        is_active:
          type: boolean
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
      required:
      - title.uz
    BannerLink:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BannerLinkKindEnum'
        product_id:
          type: integer
          nullable: true
        category:
          type: string
          nullable: true
          maxLength: 40
    BannerLinkKindEnum:
      enum:
      - none
      - product
      - category
      type: string
      description: |-
        * `none` - none
        * `product` - product
        * `category` - category
    BannerLinkRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BannerLinkKindEnum'
        product_id:
          type: integer
          nullable: true
        category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
    BannerResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Banner'
      required:
      - results
    BannerTitlePatchRequest:
      type: object
      description: '``title`` of ``PATCH banners/{id}/``: any subset of the three
        leaves (merged into the stored title).'
      properties:
        uz:
          type: string
          minLength: 1
          maxLength: 80
        ru:
          type: string
          maxLength: 80
        en:
          type: string
          maxLength: 80
    BillzImportModeEnum:
      enum:
      - delta
      - full
      type: string
      description: |-
        * `delta` - delta
        * `full` - full
    BillzImportRequest:
      type: object
      description: 'Body of ``POST integrations/billz/import/``: ``{}`` or ``{"mode":
        "delta"|"full"}``.'
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/BillzImportModeEnum'
          default: delta
    BillzStatus:
      type: object
      properties:
        connected:
          type: boolean
        last_sync_at:
          type: string
          format: date-time
          nullable: true
      required:
      - connected
      - last_sync_at
    BlockKindEnum:
      enum:
      - busy
      - 'off'
      type: string
      description: |-
        * `busy` - busy
        * `off` - off
    BookingService:
      type: object
      description: 'One bookable service of a specialist: the snapshot an admin booking
        would take (contract §2.9 meta).'
      properties:
        id:
          type: integer
        name:
          type: string
        short_name:
          type: string
        duration_min:
          type: integer
        price:
          type: integer
      required:
      - duration_min
      - id
      - name
      - price
      - short_name
    BookingSpecialist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          $ref: '#/components/schemas/SpecialistRoleEnum'
        services:
          type: array
          items:
            $ref: '#/components/schemas/BookingService'
      required:
      - id
      - name
      - role
      - services
    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    Cancellation:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/CancellationReasonEnum'
        note:
          type: string
          nullable: true
      required:
      - note
      - reason
    CancellationReasonEnum:
      enum:
