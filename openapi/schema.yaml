      description: |-
        ``POST me/email/``: the address, its e-mail code and, unless the session is fresh, the
        re-authentication.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 128
        verification_token:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        email:
          type: string
          minLength: 1
          maxLength: 270
      required:
      - code
      - email
    MePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 128
        verification_token:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
    MePhoneCodeRequest:
      type: object
      description: '``POST me/phone/code/``.'
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - phone
    MePhoneRequest:
      type: object
      description: '``POST me/phone/``: the phone, its SMS code and, unless the session
        is fresh, the re-authentication.'
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 128
        verification_token:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        phone:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - code
      - phone
    MeSocialLinkRequest:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/CustomerSocialProviderEnum'
        token:
          type: string
          minLength: 1
          maxLength: 4096
        token_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SocialTokenTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        nonce:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
        authorization_code:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1024
        password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 128
        verification_token:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
      required:
      - provider
      - token
    MetaSegment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        size:
          type: integer
      required:
      - id
      - name
      - size
    MfaChallenge:
      type: object
      description: |-
        The 200 of ``auth/login/`` and ``auth/oauth/{provider}/`` for an account with the panel MFA on: no
        session yet, answer the challenge at ``auth/mfa/verify/``.
      properties:
        mfa_required:
          type: boolean
          description: Always `true` (tells this answer from a session).
        challenge:
          type: string
          description: Opaque, single use; send it to `auth/mfa/verify/`.
        challenge_expires_at:
          type: string
          format: date-time
          description: 5 minutes after the first step.
      required:
      - challenge
      - challenge_expires_at
      - mfa_required
    MfaConfirmRequest:
      type: object
      description: '``POST auth/mfa/confirm/`` body.'
      properties:
        device_id:
          type: integer
          minimum: 1
        code:
          type: string
          writeOnly: true
          minLength: 1
          description: The 6-digit code the authenticator shows now.
          maxLength: 16
      required:
      - code
      - device_id
    MfaDisableRequest:
      type: object
      description: '``POST auth/mfa/disable/`` body.'
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        code_or_recovery:
          type: string
          writeOnly: true
          minLength: 1
          description: The authenticator's 6-digit code or one unused recovery code.
          maxLength: 32
      required:
      - code_or_recovery
      - current_password
    MfaPasswordRequest:
      type: object
      description: '``POST auth/mfa/setup/`` body.'
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
    MfaRecoveryCodes:
      type: object
      description: '``auth/mfa/confirm/`` and ``auth/mfa/recovery-codes/`` (200):
        shown once, never again.'
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: Ten `xxxxx-xxxxx` codes.
      required:
      - recovery_codes
    MfaRegenerateRequest:
      type: object
      description: '``POST auth/mfa/recovery-codes/`` body.'
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        code:
          type: string
          writeOnly: true
          minLength: 1
          description: The 6-digit code the authenticator shows now.
          maxLength: 16
      required:
      - code
      - current_password
    MfaSetup:
      type: object
      description: '``POST auth/mfa/setup/`` (200): the pending device to scan (QR
        of ``otpauth_uri``) or type.'
      properties:
        device_id:
          type: integer
        otpauth_uri:
          type: string
          description: '`otpauth://totp/…`, issuer "Glow Derma Admin".'
        manual_key:
          type: string
          description: The secret in base32, in groups of four.
      required:
      - device_id
      - manual_key
      - otpauth_uri
    MfaStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: A confirmed admin panel TOTP device (= `me.mfa_enabled`).
        recovery_codes_left:
          type: integer
          description: Unused recovery codes (0 while off).
      required:
      - enabled
      - recovery_codes_left
    MfaVerifyRequest:
      type: object
      description: '``POST auth/mfa/verify/`` body: the challenge and exactly one
        of ``code`` / ``recovery_code``.'
      properties:
        challenge:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        code:
          type: string
          writeOnly: true
          minLength: 1
          description: The authenticator's 6-digit code.
          maxLength: 16
        recovery_code:
          type: string
          writeOnly: true
          minLength: 1
          description: One unused recovery code instead of `code` (`xxxxx-xxxxx`;
            case and dashes are ignored).
          maxLength: 32
      required:
      - challenge
