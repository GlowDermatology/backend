components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
      required:
      - access
      - access_expires_at
      - refresh_expires_at
    Ack:
      type: object
      properties:
        acknowledged:
          type: integer
      required:
      - acknowledged
    AckRequestRequest:
      type: object
      properties:
        inbox_ids:
          type: array
          items:
            type: integer
            maximum: 9223372036854775807
            minimum: -9223372036854775808
            format: int64
          maxItems: 50
      required:
      - inbox_ids
    Activation:
      type: object
      description: 'An e-mailed password link: queued for the person''s address (``sent``),
        valid until ``expires_at``.'
      properties:
        sent:
          type: boolean
          description: The e-mail was queued (delivered by the outbox).
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - sent
    Actor:
      type: object
      description: |-
        ``Actor = {"id", "display_name"}``: the staff full name, else the email (``null`` = system).

        Takes any staff user instance; declare it with ``allow_null=True`` where the actor may be the system.
      properties:
        id:
          type: integer
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
    AddressWriteRequest:
      type: object
      description: |-
        ``POST`` (``text`` required) and ``PATCH`` (``partial``) of ``me/addresses/`` (customer contract
        §2.2.7).
      properties:
        label:
          type: string
          maxLength: 60
        text:
          type: string
          minLength: 1
          maxLength: 300
        region_code:
          type: string
        city_code:
          type: string
        comment:
          type: string
          maxLength: 200
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
        is_default:
          type: boolean
      required:
      - text
    AdjustmentDirectionEnum:
      enum:
      - add
      - subtract
      type: string
      description: |-
        * `add` - add
        * `subtract` - subtract
    AdminCustomerSession:
      type: object
      description: One open session of the customer (``CustomerSession`` without ``current``).
      properties:
        id:
          type: string
          format: uuid
        device:
          type: string
        platform:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OrderChannelEnum'
          - $ref: '#/components/schemas/NullEnum'
        location:
          type: string
          description: '"Tashkent, Tashkent, UZ"; "—" when unknown.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - device
      - id
      - location
      - platform
      - updated_at
    AdminImageRenditions:
      type: object
      properties:
        portrait:
          allOf:
          - $ref: '#/components/schemas/AdminRendition'
          nullable: true
        square:
          allOf:
          - $ref: '#/components/schemas/AdminRendition'
          nullable: true
      required:
      - portrait
      - square
    AdminLoginResult:
      oneOf:
      - $ref: '#/components/schemas/LoginResponse'
      - $ref: '#/components/schemas/MfaChallenge'
    AdminRendition:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Full-size WebP of the shape (long side ≤ 2000 px).
        medium_url:
          type: string
          format: uri
          description: 1000 px WebP variant.
        thumbnail_url:
          type: string
          format: uri
          description: 400 px WebP variant.
        crop:
          type: array
          items:
            type: number
            format: double
          description: '[x, y, w, h], 0-1 of the image.'
          maxItems: 4
          minItems: 4
        mode:
          $ref: '#/components/schemas/RenditionModeEnum'
      required:
      - crop
      - medium_url
      - mode
      - thumbnail_url
      - url
    AllowedActionsEnum:
      enum:
      - confirm
      - reject
      - attend
      - reschedule
      - cancel
      type: string
      description: |-
        * `confirm` - confirm
        * `reject` - reject
