      type: object
      description: |-
        ``phone`` **or** ``email`` (hybrid identity, customer contract §2.1): exactly one per call. Neither →
        ``phone`` ``required`` (``field.identifier_required``); both → ``email`` ``invalid``
        (``field.identifier_ambiguous``). ``validated_data["identifier"]`` is the one given (an address holds
        ``@``, a phone never does).
      properties:
        phone:
          type: string
          nullable: true
          minLength: 1
          maxLength: 32
        email:
          type: string
          nullable: true
          minLength: 1
          maxLength: 270
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        verification_token:
          type: string
          nullable: true
          maxLength: 128
        otp_channel:
          nullable: true
          description: |-
            New device: send the code by SMS to the account's phone or to its verified e-mail instead of the identifier signed in with (`NextStep.channels` lists what the account has); a channel the account lacks → field `otp_channel` `invalid`.

            * `sms` - sms
            * `email` - email
          oneOf:
          - $ref: '#/components/schemas/OtpChannelEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - password
