  /api/v1/admin/appointments/range/:
    get:
      operationId: admin_appointments_range
      description: 'The week and month boards: per Tashkent day of `from`…`to` (inclusive)
        the status counts of the appointments starting that day, whether any listed
        specialist works and their combined hours. `detail=counts` (default) allows
        up to 42 days; `detail=full` (up to 7 days) adds every specialist''s day schedule
        and the appointments in the day-item shape. Specialists follow the day board''s
        rule over the whole range (active ones, plus inactive ones with an appointment
        in it); `specialist_id` narrows specialists, counts and appointments to one.'
      parameters:
      - in: query
        name: detail
        schema:
          enum:
          - counts
          - full
          type: string
          default: counts
          minLength: 1
        description: |-
          * `counts` - counts
          * `full` - full
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: specialist_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - admin
      security:
      - StaffJWT: []
      responses:
        '200':
          content:
