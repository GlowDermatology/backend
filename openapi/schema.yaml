      - failed
      type: string
      description: |-
        * `draft` - draft
        * `tested` - tested
        * `scheduled` - scheduled
        * `sending` - sending
        * `stopping` - stopping
        * `sent` - sent
        * `partially_sent` - partially_sent
        * `cancelled` - cancelled
        * `failed` - failed
    NullEnum:
      enum:
