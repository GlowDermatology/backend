          not a secret).
      - in: header
        name: X-GD-Platform
        schema:
          type: string
          enum:
          - android
          - ios
          - web
        description: Device platform (`OrderChannel` literals); `web` = the website's
          server-side BFF.
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
        description: A category slug.
      - in: query
