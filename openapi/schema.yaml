  /api/v1/admin/audit-log/:
    get:
      operationId: admin_audit_log_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: actor
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
          - xlsx
        description: Download the filtered list as a file instead of the JSON page.
      - in: query
        name: object_id
        schema:
          type: string
          minLength: 1
          maxLength: 254
      - in: query
        name: object_type
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: ordering
        schema:
          enum:
          - -at
          - at
          type: string
          default: -at
          minLength: 1
        description: |-
          * `-at` - -at
          * `at` - at
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 20
          - 50
      tags:
      - admin
      security:
