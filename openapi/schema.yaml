      type: object
      description: |-
        ``PATCH categories/{slug}/``: every field optional; ``remove_image: true`` drops the stored image
        (gap ADM-5.1; refused together with a new ``image`` part: ``remove_image`` ``invalid``).
      properties:
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]{2,40}$
        name:
          $ref: '#/components/schemas/CategoryNameRequest'
        is_active:
          type: boolean
          default: true
        seo:
          $ref: '#/components/schemas/SeoTextsRequest'
        remove_image:
          type: boolean
          default: false
    PatchedClinicLocationPatchRequest:
      type: object
      description: Texts merge leaf by leaf. Coordinates must be set or cleared together.
      properties:
        name:
          $ref: '#/components/schemas/LocationNameRequest'
        address:
          $ref: '#/components/schemas/LocationAddressRequest'
        directions:
          $ref: '#/components/schemas/LocationDirectionsRequest'
        phone:
          type: string
          nullable: true
          minLength: 1
          description: An Uzbek mobile number; separators and a missing +998 are accepted
            and the value is normalised to E.164 (+998XXXXXXXXX).
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
        is_active:
          type: boolean
    PatchedClinicServiceWriteRequest:
      type: object
      description: |-
        Body of ``POST …/services/`` and (``partial``) ``PATCH …/services/{id}/`` of one specialist (texts
        merge leaf by leaf). ``category`` defaults from the specialist's role on create.
      properties:
        name:
          $ref: '#/components/schemas/ServiceNameRequest'
        short_name:
          $ref: '#/components/schemas/ServiceShortNameRequest'
        description:
          $ref: '#/components/schemas/ServiceDescriptionRequest'
        category:
          allOf:
          - $ref: '#/components/schemas/ServiceCategoryEnum'
          description: |-
            Defaults from the specialist's role on create.

            * `dermatology` - dermatology
            * `cosmetology` - cosmetology
        price:
          type: integer
          maximum: 100000000
          minimum: 0
          description: So'm, 0 … 100 000 000; snapshotted by every booking.
        duration_min:
          type: integer
          maximum: 480
          minimum: 5
          description: Minutes, a multiple of 5 (5 … 480).
        position:
          type: integer
          maximum: 100000
          minimum: 0
          description: Order within the specialist's services; appended last on create.
        is_active:
          type: boolean
          default: true
    PatchedClinicSpecialistPatchRequest:
      type: object
      description: |-
        ``PATCH specialists/{id}/`` (validated with ``partial=True``): every field optional; ``qualifications``
        and ``bio`` merge leaf by leaf; ``force`` confirms a deactivation despite upcoming appointments.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        role:
          $ref: '#/components/schemas/SpecialistRoleEnum'
        qualifications:
          $ref: '#/components/schemas/SpecialistTextRequest'
        bio:
          $ref: '#/components/schemas/SpecialistTextRequest'
        experience_years:
          type: integer
          maximum: 80
          minimum: 0
          nullable: true
        slot_step_min:
          type: integer
          description: 'The customer slot grid in minutes: 10, 15, 20, 30 (default)
            or 60.'
        location_id:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: The primary clinic, which must be included in location_ids.
        location_ids:
          type: array
          items:
            type: integer
            maximum: 2147483647
            minimum: 1
        position:
          type: integer
          maximum: 100000
          minimum: 0
        is_active:
          type: boolean
          description: 'Published: listed on the website and bookable. Publishing
            needs a complete profile.'
        slug:
          type: string
          minLength: 1
          description: Optional on create (derived from the name).
          maxLength: 160
        force:
          type: boolean
          default: false
          description: 'With is_active=false: deactivate even with requested/confirmed
            appointments ahead.'
