        ``PATCH banners/{id}/`` (JSON or multipart): ``title`` merged leaf by leaf, every field optional.

        An unchanged ``link.product_id`` is not re-checked against the active products, so a banner whose product
        was hidden later can still be edited or switched off (contract §2.5).
      properties:
        title:
          $ref: '#/components/schemas/BannerTitlePatchRequest'
        link:
          $ref: '#/components/schemas/BannerLinkRequest'
        is_active:
          type: boolean
          default: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
    PatchedCategoryPatchFormRequest:
      type: object
