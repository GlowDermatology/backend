name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: glowderma
          POSTGRES_PASSWORD: glowderma
          POSTGRES_DB: glowderma
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U glowderma -d glowderma"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run lint-imports
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run coverage run -m pytest
      - run: uv run coverage report --fail-under=85
      - run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
      - run: diff -u openapi/schema.yaml /tmp/schema.yaml
      - name: Production deploy checks
        # Secrets are generated per run (production refuses the values committed in .env.example); the rest
        # are non-secret placeholders that satisfy production settings validation.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          JWT_ACTIVE_KID: ci
          DATABASE_URL: postgres://glowderma:glowderma@localhost:5433/glowderma
          REDIS_URL: redis://localhost:6380/0
          ALLOWED_HOSTS: api.example.uz
          ADMIN_API_ALLOWED_NETS: 10.0.0.0/8
          PUBLIC_MEDIA_BASE_URL: https://media.example.uz/media/
          SECURE_SSL_REDIRECT: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_PRELOAD: "true"
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          export INTERNAL_API_SECRET="$(openssl rand -hex 24)"
          export JWT_SIGNING_KEYS="{\"ci\":\"$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')\"}"
          # M2 customer API keys (required by production settings; generated per run).
          export SMS_CODE_HMAC_KEY="$(openssl rand -hex 32)" LOG_PII_KEY="$(openssl rand -hex 32)"
          export PAYMENT_REF_KEY="$(openssl rand -hex 32)" QR_HMAC_KEY="$(openssl rand -hex 32)"
          export BTS_WEBHOOK_SECRET="$(openssl rand -hex 32)"
          export CLICK_SECRET_KEY="$(openssl rand -hex 16)" PAYME_KEY="$(openssl rand -hex 16)"
          export SECRETBOX_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          uv run python manage.py check --deploy --fail-level WARNING
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t glowderma-backend:ci .
