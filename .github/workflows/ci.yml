name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie  # the version compose.prod.yaml pins
        env:
          POSTGRES_USER: glowderma
          POSTGRES_PASSWORD: glowderma
          POSTGRES_DB: glowderma
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U glowderma -d glowderma"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run lint-imports
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Migrations run as the non-superuser application role
        # Production connects as glowderma_app (deploy/postgres/app-role.psql): database owner, not a superuser.
        # Every migration (extensions, collation, triggers, concurrent indexes) must work under it on PostgreSQL 18.
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: glowderma
          PGPASSWORD: glowderma
          POSTGRES_USER: glowderma
          POSTGRES_DB: gd_app_role
        run: |
          psql -v ON_ERROR_STOP=1 -d glowderma -c "DROP DATABASE IF EXISTS gd_app_role" -c "CREATE DATABASE gd_app_role"
          export POSTGRES_APP_PASSWORD="$(openssl rand -hex 24)"
          deploy/postgres/10-app-role.sh
          test "$(psql -At -d gd_app_role -c "SELECT rolsuper FROM pg_roles WHERE rolname = 'glowderma_app'")" = f
          DATABASE_URL="postgres://glowderma_app:${POSTGRES_APP_PASSWORD}@localhost:5433/gd_app_role" \
            uv run python manage.py migrate --noinput -v 1
          psql -v ON_ERROR_STOP=1 -d glowderma -c "DROP DATABASE gd_app_role"
      - run: uv run coverage run -m pytest
      - run: uv run coverage report --fail-under=85
      - run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
      - run: diff -u openapi/schema.yaml /tmp/schema.yaml
      - name: Production deploy checks
        # Secrets are generated per run (production refuses the values committed in .env.example); the rest
        # are non-secret placeholders that satisfy production settings validation. Every provider runs fake
        # here (INTEGRATIONS_MODE defaults to fake): M3's live-only variables (Billz, Click ids, Payme merchant,
        # BTS, Eskiz, FCM, Apple) are required only when their *_MODE is live; the list below is what
        # config/settings/production.py requires in every mode (the secrets of deploy/env.production.example
        # plus what compose.prod.yaml sets).
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          JWT_ACTIVE_KID: ci
          DATABASE_URL: postgres://glowderma:glowderma@localhost:5433/glowderma
          REDIS_URL: redis://localhost:6380/0
          ALLOWED_HOSTS: api.example.uz
          ADMIN_API_ALLOWED_NETS: 10.0.0.0/8
          PUBLIC_MEDIA_BASE_URL: https://media.example.uz/media/
          SECURE_SSL_REDIRECT: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_PRELOAD: "true"
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          export INTERNAL_API_SECRET="$(openssl rand -hex 24)"
          export JWT_SIGNING_KEYS="{\"ci\":\"$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')\"}"
          # M2 customer API keys (required by production settings; generated per run).
          export SMS_CODE_HMAC_KEY="$(openssl rand -hex 32)" LOG_PII_KEY="$(openssl rand -hex 32)"
          export PAYMENT_REF_KEY="$(openssl rand -hex 32)" QR_HMAC_KEY="$(openssl rand -hex 32)"
          export BTS_WEBHOOK_SECRET="$(openssl rand -hex 32)"
          export CLICK_SECRET_KEY="$(openssl rand -hex 16)" PAYME_KEY="$(openssl rand -hex 16)"
          export SECRETBOX_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          uv run python manage.py check --deploy --fail-level WARNING
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t glowderma-backend:ci .
      - name: Production compose file resolves
        # An unedited copy of the template must be refused (empty passwords, no release tags); filled with
        # generated passwords and the tags deploy/pin-release.sh writes, it must resolve.
        run: |
          cp deploy/env.production.example .env
          if docker compose -f compose.prod.yaml config --quiet 2>/dev/null; then
            echo "an unedited copy of deploy/env.production.example was accepted" >&2
            exit 1
          fi
          for name in POSTGRES_PASSWORD POSTGRES_APP_PASSWORD REDIS_PASSWORD; do
            sed -i "s/^${name}=\$/${name}=$(openssl rand -hex 24)/" .env
          done
          deploy/pin-release.sh "ci-${GITHUB_SHA::7}" ci
          docker compose -f compose.prod.yaml config --quiet
          rm .env
      - name: Edge Caddyfile is valid
        run: >-
          docker run --rm -v "$PWD/deploy:/etc/caddy:ro"
          -e ACME_EMAIL=ci@example.com -e SITE_DOMAIN=example.com -e ADMIN_DOMAIN=admin.example.com
          -e API_DOMAIN=api.example.com -e OPS_DOMAIN=ops.example.com
          -e "OPS_ALLOWED_IPS=192.0.2.10/32 198.51.100.0/24" caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Edge behaviour probe
        # The Caddyfile in the pinned Caddy, in front of a stub: callbacks forwarded with their query string,
        # private paths 404, body limits and buffering, headers, the ops console host (allow-list, CSP, 404s),
        # and no query string, Referer query or token header in the access or error logs (a 502 included).
        run: |
          docker create --name caddy-bin caddy:2.10.2-alpine >/dev/null
          docker cp caddy-bin:/usr/bin/caddy "$RUNNER_TEMP/caddy"
          docker rm caddy-bin >/dev/null
          python3 deploy/edge_probe.py --caddy "$RUNNER_TEMP/caddy"
