# Local development stack (Django + Celery + PostgreSQL + Redis). Production runs from the infra repository
# (GlowDermatology/infra): images from GHCR, secrets from Vault, Caddy in front.
x-app: &app
  build: .
  env_file: .env
  environment: &environment
    DJANGO_SETTINGS_MODULE: config.settings.local
    POSTGRES_NAME: ${POSTGRES_NAME:-glowderma}
    POSTGRES_USER: ${POSTGRES_USER:-glowderma}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glowderma}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    # local settings default to eager (inline) tasks for a bare runserver; compose runs a real worker.
    CELERY_TASK_ALWAYS_EAGER: "false"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    command: api
    environment:
      <<: *environment
      # Local development only: production runs migrations once per release in a dedicated container.
      MIGRATE_ON_START: "true"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["media:/app/media"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': 'localhost'}), timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 6
  worker:
    <<: *app
    command: worker
    volumes: ["media:/app/media"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
  beat:
    <<: *app
    command: beat
    healthcheck: {disable: true}
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glowderma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glowderma}
      POSTGRES_DB: ${POSTGRES_NAME:-glowderma}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.10.3-alpine3.23
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local S3 (SeaweedFS): docker compose --profile object-storage up -d object-storage object-storage-init
  # docker/object-storage/s3.json holds DEV-ONLY dummy keys, not for production.
  object-storage:
    profiles: ["object-storage"]
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - objectdata:/data
      - ./docker/object-storage/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 10
  object-storage-init:
    profiles: ["object-storage"]
    image: amazon/aws-cli:2.40.3@sha256:33a16c53ea442e918b58df67301ad76a8fb57082c39f7e78753b898c3f3e87c2
    depends_on:
      object-storage:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: glowderma-admin
      AWS_SECRET_ACCESS_KEY: glowderma-admin-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    # Creates the bucket; an existing bucket (HTTP 409: BucketAlreadyOwnedByYou / BucketAlreadyExists) is success.
    command:
      - |
        out=$$(aws --endpoint-url http://object-storage:8333 s3api create-bucket --bucket glowderma-media 2>&1) && { echo "bucket created"; exit 0; }
        case "$$out" in *BucketAlreadyOwnedByYou*|*BucketAlreadyExists*|*"(409)"*) echo "bucket exists"; exit 0;; esac
        echo "$$out" >&2; exit 1

volumes:
  pgdata:
  media:
  objectdata:
