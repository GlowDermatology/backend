# Local development stack (Django + Celery + PostgreSQL + Redis). Production runs from the infra repository
# (GlowDermatology/infra): images from GHCR, secrets from Vault, Caddy in front.
x-app: &app
  build: .
  env_file: .env
  environment: &environment
    DJANGO_SETTINGS_MODULE: config.settings.local
    POSTGRES_NAME: ${POSTGRES_NAME:-glowderma}
    POSTGRES_USER: ${POSTGRES_USER:-glowderma}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glowderma}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    # local settings default to eager (inline) tasks for a bare runserver; compose runs a real worker.
    CELERY_TASK_ALWAYS_EAGER: "false"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    command: api
    environment:
      <<: *environment
      # Local development only: production runs migrations once per release in a dedicated container.
      MIGRATE_ON_START: "true"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["media:/app/media"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': 'localhost'}), timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 6
  worker:
    <<: *app
    command: worker
    volumes: ["media:/app/media"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
  beat:
    <<: *app
    command: beat
    healthcheck: {disable: true}
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glowderma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glowderma}
      POSTGRES_DB: ${POSTGRES_NAME:-glowderma}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.10.3-alpine3.23
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
